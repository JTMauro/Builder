[project]
name = "media-backend"
version = "0.3.0"
description = "Audio/video processing backend with a built-in Claude assistant and an MCP connector for Claude Code."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "mcp>=2.3",
  "httpx2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
media-backend = "media_backend.cli:main"
builder = "media_backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["media_backend"]

[tool.setuptools.package-data]
media_backend = ["static/*"]
