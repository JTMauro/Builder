[project]
name = "media-backend"
version = "0.3.0"
description = "Audio/video processing backend with a built-in Claude assistant and an MCP connector for Claude Code."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "mcp>=2.3",
  "httpx2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Free local voices (Kokoro), captions (Whisper) and lip-sync: pip install "builder[voice]"
voice = ["kokoro-onnx>=0.4", "faster-whisper>=1.1", "numpy>=1.26"]
motion = ["mediapipe>=0.10", "numpy>=1.26"]
# Picture to 3D model (TripoSR, MIT): pip install "builder[image3d]" --extra-index-url https://download.pytorch.org/whl/cpu
image3d = ["torch>=2.1", "omegaconf>=2.3", "einops>=0.7", "transformers>=4.35", "trimesh>=4.0", "rembg>=2.0.50",
           "scikit-image>=0.22", "fast-simplification>=0.1", "imageio>=2.30", "huggingface_hub>=0.20", "numpy>=1.26", "pillow>=10",
           "xatlas>=0.0.9", "scipy>=1.10"]  # xatlas (MIT): UV unwrap for texture=true / bake_texture
# Local senses: watch_video (Qwen3-VL-2B), caption_audio (CLAP), quality_score (LPIPS + LAION aesthetic), all CPU:
# pip install "builder[senses]" --extra-index-url https://download.pytorch.org/whl/cpu
senses = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.57", "lpips>=0.1.4", "huggingface_hub>=0.20", "numpy>=1.26", "pillow>=10"]

[project.scripts]
media-backend = "media_backend.cli:main"
builder = "media_backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["media_backend"]

[tool.setuptools.package-data]
media_backend = ["static/*"]
