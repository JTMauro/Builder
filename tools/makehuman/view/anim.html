<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#e9ebec}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from "three"; import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { retarget, gestures } from "./anim.js";
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9ebec);
scene.add(new THREE.HemisphereLight(0xe6eeff, 0x6f665c, 1.0));
const key = new THREE.DirectionalLight(0xfff1e0, 2.6); key.position.set(1.6, 3.0, 1.8); key.castShadow = true;
Object.assign(key.shadow.camera, { left: -1.1, right: 1.1, top: 2.2, bottom: -0.3, near: 0.5, far: 9 }); key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; scene.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), new THREE.MeshStandardMaterial({ color: 0xd5d9dc, roughness: 1 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.05, 50);
const L = new GLTFLoader();
const [boy, bot] = await Promise.all([L.loadAsync(new URLSearchParams(location.search).get("m")), L.loadAsync("Xbot.glb")]);
const root = boy.scene; scene.add(root);
root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; if (/brow|lash|hair/i.test(o.material?.name || "")) { o.material.alphaTest = 0.2; o.material.transparent = false; if (/hair/i.test(o.material.name)) { o.material.side = THREE.FrontSide; o.receiveShadow = false; } } } });
const t0 = performance.now();
const moves = retarget(bot.scene, bot.animations, root);
const mixer = new THREE.AnimationMixer(root);
const idle = moves.find(c => c.name === "idle"); mixer.clipAction(idle).play(); mixer.setTime(0); root.updateMatrixWorld(true);
const base = new Map(); root.traverse(o => { if (o.isBone) base.set(o, o.quaternion.clone()); });
mixer.stopAllAction();
const all = [...moves, ...gestures(root, base)];
window.__clips = all.map(c => c.name + " " + c.duration.toFixed(2)); window.__ms = Math.round(performance.now() - t0);
window.__show = (name, t, view) => {
  mixer.stopAllAction(); const c = all.find(c => c.name === name); mixer.clipAction(c).play(); mixer.setTime(t); root.updateMatrixWorld(true);
  const H = 1.64, P = { front: [[0, H * .6, H * 2.9], [0, H * .52, 0]], three: [[H * 1.5, H * .65, H * 2.5], [0, H * .52, 0]], side: [[H * 2.9, H * .6, 0.01], [0, H * .52, 0]], hand: [[-0.6, 1.3, 1.3], [-0.2, 1.15, 0.3]], rhand: [[-0.75, 1.25, 0.9], [-0.25, 1.1, 0.35]], chest: [[0.25, 1.15, 0.95], [0, 1.0, 0.1]], torso: [[0.0, 1.25, 1.25], [0, 1.15, 0]], torso3: [[0.7, 1.25, 1.0], [0, 1.15, 0]], prof: [[2.6, 1.2, 0.02], [0, 1.2, 0]] }[view] || [[0, 1, 3], [0, 1, 0]];
  cam.position.set(...P[0]); cam.lookAt(...P[1]);
  if (view === "rhand" || view === "lhand" || view === "rhand2") {
    let hb; root.traverse(o => { if (o.isBone && /(Right|Left)Hand$/.test(o.name) && o.name.includes(view === "lhand" ? "Left" : "Right")) hb = o; });
    const hp = hb.getWorldPosition(new THREE.Vector3()); const off = view === "rhand2" ? new THREE.Vector3(-0.55, 0.15, 0.25) : new THREE.Vector3(0.25, 0.12, 0.6);
    cam.position.copy(hp).add(off); cam.lookAt(hp);
  }
  r.render(scene, cam);
};
window.__ready = true;
</script></body></html>
