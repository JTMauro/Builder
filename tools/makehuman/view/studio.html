<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

  lines: [], beats: [

// preview mode (Builder's Studio tab plays a scene live, without rendering): studio.html?preview waits for

// loading helpers (.json = one-file glTF from glb2json.py)

const setProps = [];   // { id, obj, use, n, pivot, busy: { seatIndex: actorId } }

    a.group.position.set(a.spec.at?.[0] || 0, 0, a.spec.at?.[1] || 0); a.group.rotation.y = (a.spec.face || 0) * Math.PI / 180;
    a.target = null; a.after = null; a.pending = null; a.turnTo = null; if (a.pose) endPose(a);
    a.group.position.set(a.spec.at?.[0] || 0, 0, a.spec.at?.[1] || 0); a.group.rotation.set(0, (a.spec.face || 0) * Math.PI / 180, 0);

  simT += dt;
}

try {
  const [bot, cmu] = await Promise.all([loadGltfJson("clips/mixamo-clips.json"), getJSON("clips/cmu-clips.json")]);
  const credit = await buildSet();
  for (const b of S.beats || []) { const ps = propSpec(b); if (ps && ps !== "none" && ps.prop && !propSrc[ps.prop]) propSrc[ps.prop] = await loadProp(ps.prop); }
  for (const spec of S.cast) {

    makeActor(spec, m);
  }

  window.__ready = true;
} catch (e) { console.error(e); status.textContent = "Could not load: " + e.message; window.__ready = "error"; }

window.__prepare = async () => Object.keys(actors);
window.__actors = actors; window.__grip = GRIP; window.__cam = cam; window.__loadProp = loadProp; window.__three = scene;   // for tuning grips from the console
window.__step = async (dt, draw = true) => frame(dt, draw);
window.__heads = heads; window.__props = setProps;
if (S.traceFeet) window.__footTrace = [];   // tuning: per-frame foot height and ground speed in the events
window.__events = () => window.__footTrace ? [...events, { trace: window.__footTrace }] : events;
if (live && window.__ready === true) { const clock = new THREE.Clock(); r.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.05); if (simT > S.duration) restart(); frame(dt); }); }
